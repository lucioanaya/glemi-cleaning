<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Create password · GLEMI Admin</title>
  <link rel="stylesheet" href="admin.css">
  <style>
    .password-page{min-height:100vh;display:grid;place-items:center;padding:24px;background:#f6f8fb}
    .password-card{width:min(460px,100%);background:#fff;border:1px solid #e5e7eb;border-radius:22px;padding:32px;box-shadow:0 18px 50px rgba(15,23,42,.09)}
    .password-card .admin-logo{display:block;margin:0 auto 18px}
    .password-card h1{text-align:center;margin:0 0 8px}
    .password-card .lead{text-align:center;margin:0 0 24px;color:#64748b}
    .password-form{display:grid;gap:14px}
    .password-form label{font-weight:700;color:#0f172a}
    .password-form input{width:100%;box-sizing:border-box;margin-top:7px;padding:13px 14px;border:1px solid #cbd5e1;border-radius:12px;font:inherit}
    .password-form button{margin-top:4px}
    .status{min-height:24px;margin:14px 0 0;text-align:center}
    .status.error{color:#b91c1c}.status.ok{color:#166534}
    .back-link{display:block;text-align:center;margin-top:18px;color:#1d4ed8;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <main class="password-page">
    <section class="password-card">
      <img src="glemi-logo.png" alt="GLEMI" class="admin-logo">
      <p class="eyebrow" style="text-align:center">GLEMI ADMIN</p>
      <h1>Create your password</h1>
      <p class="lead">Use this page to finish your invitation and activate your private admin access.</p>

      <form id="passwordForm" class="password-form" hidden>
        <label>New password
          <input id="newPassword" type="password" minlength="8" autocomplete="new-password" required placeholder="At least 8 characters">
        </label>
        <label>Confirm password
          <input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required placeholder="Repeat your password">
        </label>
        <button id="savePasswordBtn" class="primary" type="submit">Save password</button>
      </form>

      <p id="passwordStatus" class="status">Validating your invitation…</p>
      <a id="loginLink" class="back-link" href="admin.html" hidden>Go to Sign In</a>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="set-password.js"></script>
</body>
</html>
